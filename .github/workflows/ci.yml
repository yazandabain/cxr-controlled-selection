name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    name: Python 3.13 on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install public package
        run: python -m pip install ".[trees,figures,test]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run complete public tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic example
        run: python examples/synthetic_study.py --draws 200
      - name: Rebuild aggregate tables and figures
        run: python scripts/build_assets.py --out "${{ runner.temp }}/cxr-public-assets"
      - name: Check public files and Git history
        run: python scripts/check_release.py
